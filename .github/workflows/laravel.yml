name: Laravel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v4
       
     - name: Setup PHP
       uses: shivammathur/setup-php@v2
       with:
         php-version: '8.5'

     - name: Cache composer vendor
       uses: actions/cache@v4
       with:
         path: vendor
         key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

     - name: Install Composer Dependency
       run: composer install
       
     - name: Lint code with Pint
       run: ./vendor/bin/pint --test
       
  tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
       
      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: pcov

      - name: Cache Composer Vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
      
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        
      - name: Generate key
        run: php artisan key:generate
        
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
        
      - name: run test with JUnit and coverage
        run: php artisan test --log-junit junit.xml --coverage-clover coverage.xml

      - name: Upload test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-repost
          path: |
            junit.xml
            coverage.xml

  build:
   needs: [lint, tests]
   runs-on: ubuntu-latest
   
   steps:
     - name: Checkout code
       uses: actions/checkout@v4
       
     - name: Setup php
       uses: shivammathur/setup-php@v2
       with:
         php-version: '8.5'
         extensions: mbstring, dom, fileinfo, sqlite3
     
     - name: Cache Composer Vendor
       uses: actions/cache@v4
       with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          
     - name: Install Composer
       run: composer install
       
     - name: Copy .env
       run: php -r "file_exists('.env') || copy('.env.example', '.env');"
       
     - name: Generate Application Key
       run: php artisan key:generate

     - name: Cache Config
       run: php artisan config:cache
